<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kaarii</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Material Icons -->

          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css?v=10">

</head>

<body>

<div class="page">

    <!-- Decorative Background -->

    <div class="bg-circle bg1"></div>
    <div class="bg-circle bg2"></div>

    <main class="container">

        <!-- ==========================
                LOGO
        =========================== -->

        <div class="logo">

            <img src="images/Kaarii_LOGO.png"

        <!-- ==========================
                COMPANY
        =========================== -->

        <!-- Decorative Divider -->

        <div class="divider">

            <span></span>

            <div class="diamond"></div>

            <span></span>

        </div>

        <!-- ==========================
                TITLE
        =========================== -->

        <h1 class="title">

            Step Into Kaarii

        </h1>

        <!-- ==========================
                SUBTITLE
        =========================== -->

        <p class="subtitle">

            Where materials find meaning,<br>
            craft becomes conversation,<br>
            and every piece begins with a dream.

        </p>

        <!-- ==========================
                CARD GRID
        =========================== -->

       <section class="cards">

        <a href="#" class="card">
            <h3>NYX Bed</h3>
        </a>
    
        <a href="#" class="card">
            <h3>EOS Bedside Table</h3>
        </a>
    
        <a href="#" class="card">
            <h3>SELENE Sofa</h3>
        </a>
    
        <a href="#" class="card">
            <h3>GAIA Centre Table</h3>
        </a>
    
        <a href="#" class="card">
            <h3>HESPER Chair</h3>
        </a>
    
        <a href="#" class="card">
            <h3>ATLAS Unit</h3>
        </a>
    
        <a href="#" class="card">
            <h3>LATTICE Wall</h3>
        </a>
    
        <a href="#" class="card">
            <h3>ASTERIA Wall</h3>
        </a>
    
    </section>

        <!-- ==========================
                FOOTER DIVIDER
        =========================== -->

        <div class="divider footer-divider">

            <span></span>

            <div class="diamond"></div>

            <span></span>

        </div>

        <!-- ==========================
                FOOTER
        =========================== -->

        <footer>

            <h2>

                This is Kaarii. We are Dream makers.

            </h2>

        </footer>

    </main>

</div>

<!-- Main JavaScript -->

<script src="script.js"></script>
