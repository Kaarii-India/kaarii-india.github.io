<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kaarii</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Material Icons -->
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

    <!-- Main CSS -->
    <link rel="stylesheet" href="style.css?v=2">

</head>

<body>

<div class="page">

    <!-- Decorative Background -->

    <div class="bg-circle bg1"></div>
    <div class="bg-circle bg2"></div>

    <main class="container">

        <!-- ==========================
                LOGO
        =========================== -->

        <div class="logo">

            <img src="images/Kaarii_LOGO.png"
                 alt="Kaarii Logo">

        </div>

        <!-- ==========================
                COMPANY
        =========================== -->

        <!-- Decorative Divider -->

        <div class="divider">

            <span></span>

            <div class="diamond"></div>

            <span></span>

        </div>

        <!-- ==========================
                TITLE
        =========================== -->

        <h1 class="title">

            Step Into Kaarii

        </h1>

        <!-- ==========================
                SUBTITLE
        =========================== -->

        <p class="subtitle">

            Where materials find meaning,<br>
            craft becomes conversation,<br>
            and every piece begins with a dream.

        </p>

        <!-- ==========================
                CARD GRID
        =========================== -->

        <section class="cards">

            <!-- CARD 1 -->

            <a href="#"
               class="card"
               id="videos">

                <div class="icon-circle">

                    <span class="material-symbols-outlined">

                        videocam

                    </span>

                </div>

                <h3>

                    Product Videos

                </h3>

            </a>

            <!-- CARD 2 -->

            <a href="#"
               class="card"
               id="catalogue">

                <div class="icon-circle">

                    <span class="material-symbols-outlined">

                        menu_book

                    </span>

                </div>

                <h3>

                    E-Catalogue

                </h3>

            </a>

            <!-- CARD 3 -->

            <a href="https://kaarii.co.in/"
               class="card"
               id="website"
               target="_blank"
               rel="noopener noreferrer">

                <div class="icon-circle">

                    <span class="material-symbols-outlined">

                        language

                    </span>

                </div>

                <h3>

                    Visit Website

                </h3>

            </a>

                        <!-- CARD 4 -->

            <a href="#"
               class="card"
               id="instagram">

                <div class="icon-circle social">

                    <img src="images/instagram.svg"
                         alt="Instagram">

                </div>

                <h3>

                    Instagram

                </h3>

            </a>

            <!-- CARD 5 -->

            <a href="#"
               class="card"
               id="whatsapp">

                <div class="icon-circle social">

                    <img src="images/whatsapp.svg"
                         alt="WhatsApp">

                </div>

                <h3>

                    WhatsApp

                </h3>

            </a>

            <!-- CARD 6 -->

            <a href="#"
               class="card"
               id="appointment">

                <div class="icon-circle">

                    <span class="material-symbols-outlined">

                        calendar_month

                    </span>

                </div>

                <h3>

                    Book Appointment

                </h3>

            </a>

        </section>

        <!-- ==========================
                FOOTER DIVIDER
        =========================== -->

        <div class="divider footer-divider">

            <span></span>

            <div class="diamond"></div>

            <span></span>

        </div>

        <!-- ==========================
                FOOTER
        =========================== -->

        <footer>

            <h2>

                This is Kaarii. We are Dream makers.

            </h2>

        </footer>

    </main>

</div>

<!-- Main JavaScript -->

<script src="script.js"></script>

</body>

</html>
