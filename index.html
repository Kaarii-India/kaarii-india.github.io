<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kaarii</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <!-- Logo -->

    <div class="logo">

        <img src="images/Kaarii_LOGO.png" alt="Kaarii Logo">

    </div>

    <!-- Company Name -->

    <div class="company">

        kaarii

    </div>

    <!-- Heading -->

    <h1 class="title">

        Step Into Kaarii

    </h1>

    <!-- Subtitle -->

    <p class="subtitle">

        Where materials find meaning,<br>
        craft becomes conversation,<br>
        and every piece begins with a dream.

    </p>

    <!-- Cards -->

    <div class="cards">

        <!-- Product Videos -->

        <a class="card" href="#">

            <span class="material-symbols-outlined card-icon">

                videocam

            </span>

            <span class="card-title">

                Product Videos

            </span>

        </a>

        <!-- Catalogue -->

        <a class="card" href="#">

            <span class="material-symbols-outlined card-icon">

                menu_book

            </span>

            <span class="card-title">

                Digital Catalogue

            </span>

        </a>

        <!-- Website -->

        <a class="card" href="#">

            <span class="material-symbols-outlined card-icon">

                language

            </span>

            <span class="card-title">

                Visit Website

            </span>

        </a>

        <!-- Instagram -->

        <a class="card" href="#">

            <img class="social-icon"
                 src="images/instagram.png"
                 alt="Instagram">

            <span class="card-title">

                Instagram

            </span>

        </a>

        <!-- WhatsApp -->

        <a class="card" href="#">

            <img class="social-icon"
                 src="images/whatsapp.png"
                 alt="WhatsApp">

            <span class="card-title">

                WhatsApp

            </span>

        </a>

        <!-- Appointment -->

        <a class="card" href="#">

            <span class="material-symbols-outlined card-icon">

                calendar_month

            </span>

            <span class="card-title">

                Book Appointment

            </span>

        </a>

    </div>

    <!-- Footer -->

    <div class="footer">

        Furniture that defines you.

    </div>

</div>

</body>

</html>
